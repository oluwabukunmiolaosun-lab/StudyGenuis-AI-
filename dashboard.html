<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - StudyGenius AI</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<header class="topbar">
    <h2>📚 StudyGenius AI</h2>
    <button>Logout</button>
</header>

<div class="dashboard">

    <aside class="sidebar">
        <h3>Menu</h3>
        <ul>
            <li>🏠 Dashboard</li>
            <li>🤖 AI Solver</li>
            <li>📚 Study Notes</li>
            <li>📝 Practice Quiz</li>
            <li>⭐ Saved Questions</li>
            <li>⚙️ Settings</li>
        </ul>
    </aside>

    <main class="content">

        <h1>Welcome Back!</h1>

        <div class="cards">

            <div class="card">
                <h2>Questions Solved</h2>
                <p>0</p>
            </div>

            <div class="card">
                <h2>Quiz Score</h2>
                <p>0%</p>
            </div>

            <div class="card">
                <h2>Study Streak</h2>
                <p>0 Days</p>
            </div>

            <div class="card">
                <h2>Saved Notes</h2>
                <p>0</p>
            </div>

        </div>

        <h2>Recent Activity</h2>

        <div class="activity">
            <p>No recent activity yet.</p>
        </div>

    </main>

</div>

</body>
</html>
